spring.application.name=backend

# --- JPA / Hibernate ---
# Con Flyway gestionando el esquema, Hibernate NO debe crear/modificar tablas
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# --- Flyway ---
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# --- Servidor ---
server.port=8080

# --- Logging ---
logging.level.org.hibernate.SQL=debug
logging.level.org.springframework.security=debug

# --- JWT ---
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=86400000
app.jwt.refresh-expiration-ms=604800000
# Cookie "Secure" flag requires HTTPS; false here so login works on plain-HTTP localhost.
# Overridden to true in application-prod.properties.
app.jwt.cookie-secure=false

# --- Redis ---
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.password=${REDIS_PASSWORD}


# --- Resend ---
app.resend.api-key=${RESEND_API_KEY}
app.resend.from=${EMAIL_FROM}

# --- Frontend ---
app.frontend-url=http://localhost:3000

# --- Verification tokens ---
app.token.email-verification-expiration-ms=86400000
app.token.password-reset-expiration-ms=900000

