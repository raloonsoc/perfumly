services:
  postgres:
    image: 'postgres:18-alpine'
    environment:
      - 'POSTGRES_DB=${POSTGRES_DB}'
      - 'POSTGRES_PASSWORD=${POSTGRES_PASSWORD}'
      - 'POSTGRES_USER=${POSTGRES_USER}'
    ports:
      - '5432:5432'
    volumes:
      - 'postgres_data:/var/lib/postgresql'
  redis:
    image: 'redis:8-alpine'
    environment:
      - 'REDIS_PASSWORD=${REDIS_PASSWORD}'
    # AOF persistence (fsync every second) so refresh tokens/sessions survive a restart —
    # unlike the RDB-only default, which can lose several minutes of writes on a crash.
    command: 'redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes --appendfsync everysec'
    ports:
      - '6379:6379'
    volumes:
      - 'redis_data:/data'

volumes:
  postgres_data:
  redis_data:
